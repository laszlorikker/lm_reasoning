# Phase 1 base config — every experimental knob lives here (kickoff rule 6).
# M0 subset; sections grow per milestone. The Qwen3-4B upgrade must be a config
# change only (see configs/qwen3_4b.yaml when it lands).

model:
  name_or_path: Qwen/Qwen3-1.7B-Base
  attn_implementation: sdpa      # sm_75: no flash-attn (PHASE1_PLAN §1)
  dtype: float16                 # sm_75: no bf16 (PHASE1_PLAN §1)
  load_in_4bit: false            # true for the 4B upgrade path
  split_layer: 14                # encoder = layers [0, split); ablate 12/14/16
  d_z: 1024

data:
  max_source_tokens: 512
  max_target_tokens: 512
  max_chunks: 8
  max_chunk_tokens: 64
  # ~50M source+target tokens, >=30% of pairs with K>=3 chunks (M1 addition 2).
  # Achieved counts/K-distribution land in DATA.md from runs/m1/pilot_stats.json.
  pilot:
    seed: 17
    target_multichunk_share: 0.30
    negatives:
      minimal_pair_share_en: 0.25   # share of en-source pairs that get a generated negative
      per_example: 1
    sources:
      opus100_singles: {n: 150000}
      paws_x_singles: {per_lang: 12000, langs: [en, fr, de, es]}
      qqp_singles: {n: 40000}
      mrpc_singles: {n: 3000}
      nli_entailment: {n: 30000}
      concat_translation: {n: 95000, k_min: 3, k_max: 6}
      concat_paraphrase:
        n: 25000
        k_min: 3
        k_max: 6
        lang_shares: {en: 0.7, fr: 0.1, de: 0.1, es: 0.1}
      # train_1M exhausted at ~6.8k pairs (pair discovery ~1 per 147 rows);
      # train_5M streams until the budget is met. Val separation is hash-based.
      math_derivation: {n: 20000, split: train_5M}

train:
  micro_batch_size: 8
  # optimiser / schedule / loss weights land in M2/M3

profile:
  batch_size: 8
  seq_len: 512
  # Measured Windows-side baseline on this card: 23 MiB (2026-08-31, WSL2,
  # display on the iGPU) -> the plan's 14 GB budget stands. See CLAUDE.md.
  vram_budget_gib: 14.0
