# Phase 1 base config — every experimental knob lives here (kickoff rule 6).
# M0 subset; sections grow per milestone. The Qwen3-4B upgrade must be a config
# change only (see configs/qwen3_4b.yaml when it lands).

model:
  name_or_path: Qwen/Qwen3-1.7B-Base
  attn_implementation: sdpa      # sm_75: no flash-attn (PHASE1_PLAN §1)
  dtype: float16                 # sm_75: no bf16 (PHASE1_PLAN §1)
  load_in_4bit: false            # true for the 4B upgrade path
  split_layer: 14                # encoder = layers [0, split); ablate 12/14/16
  d_z: 1024
  # M2 (spec 2026-09-01; readings in M2_DESIGN.md)
  languages: [en, fr, de, es, it, pt]
  k_max: 8
  pool_heads: 8
  pool_head_dim: 128
  xattn_every: 2                 # blocks before layers 14,16,...,26
  xattn_heads: 8
  xattn_head_dim: 128
  rate: noise                    # noise | kl
  rate_sigma: 0.1
  word_dropout: 0.2
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  encoder_lora_layers: []        # M5 ablation hook; must stay empty through M3

data:
  max_source_tokens: 512
  max_target_tokens: 512
  max_chunks: 8
  max_chunk_tokens: 64
  corpus_path: data/processed/pilot_v1.2/full
  # ~50M source+target tokens, >=30% of pairs with K>=3 chunks (M1 addition 2).
  # Achieved counts/K-distribution land in DATA.md from runs/m1/pilot_stats.json.
  pilot:
    seed: 17
    target_multichunk_share: 0.30
    negatives:
      minimal_pair_share_en: 0.25   # share of en-source pairs that get a generated negative
      per_example: 1
    sources:
      opus100_singles: {n: 150000}
      paws_x_singles: {per_lang: 12000, langs: [en, fr, de, es]}
      qqp_singles: {n: 40000}
      mrpc_singles: {n: 3000}
      nli_entailment: {n: 30000}
      concat_translation: {n: 95000, k_min: 3, k_max: 6}
      concat_paraphrase:
        n: 25000
        k_min: 3
        k_max: 6
        lang_shares: {en: 0.7, fr: 0.1, de: 0.1, es: 0.1}
      # M3.1: train_5M (~6 GB) explicitly approved 2026-09-02; exact grouped
      # join, cap 4 pairs/problem, target 30-50k pairs.
      math_derivation: {n: 45000, split: train_5M, max_pairs_per_problem: 4}

train:
  micro_batch_size: 8            # unpacked fallback only (packing is default)
  effective_batch: 64            # unpacked fallback accumulation
  # M2 loss knobs (PHASE1_PLAN §4)
  tau: 0.05
  lambda_c: 0.1
  lambda_r: 1.0e-3
  chunk_ce_size: 1024
  p_id_start: 0.2
  p_id_end: 0.05
  p_id_decay_frac: 0.2
  # M3 optimiser / schedule / run mechanics
  lr_new: 2.0e-4
  lr_lora: 1.0e-4
  # M3.1: packed steps carry 40k tokens; 100 warmup steps = 4M tokens,
  # matching the old 500 x ~7.7k. Set back to 500 if packing is disabled.
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  epochs: 1
  max_steps: 0
  seed: 1234
  log_interval: 10
  eval_interval_steps: 0         # 0 = auto from the <10% rule
  checkpoint_interval_steps: 500
  checkpoint_interval_minutes: 15.0
  keep_checkpoints: 3
  telemetry_interval_s: 30.0
  # M3.1 token-budget packing (guards a-c). A/B gate passed 2026-09-02
  # (runs/m3_1/ab_packing.json) -> packed is the default.
  packing_enabled: true
  token_budget: 40000
  micro_token_budget: 5000
  # 48 is the A/B-GATED value (decision 2026-09-02): short buckets underfill
  # (~5-10% throughput on the table), but any composition change gets bundled
  # with future ones and re-gated ONCE — do not raise this ad hoc.
  max_rows_per_micro: 48
  n_buckets: 4
  max_inbatch_negs: 31
  mini_report_every: 50          # cheap z/gates/AUC snapshot cadence...
  mini_report_until: 1000        # ...for the first N steps, then off

profile:
  batch_size: 8
  seq_len: 512
  # Measured Windows-side baseline on this card: 23 MiB (2026-08-31, WSL2,
  # display on the iGPU) -> the plan's 14 GB budget stands. See CLAUDE.md.
  vram_budget_gib: 14.0
